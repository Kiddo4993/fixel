name = "fixel-trial"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The Gemini key is NOT here: it's a secret (`npx wrangler secret put GEMINI_API_KEY`).
[vars]
DAILY_PER_INSTALL = "3"   # free questions per Fixel install per UTC day
DAILY_PER_IP = "30"       # per network: a whole school can share one IP
DAILY_TOTAL = "200"       # everyone together; keeps the owner's own free quota safe

# One TrialCounter per UTC day holds the counts. A Durable Object runs one request at a time, so the
# limits can't be raced the way KV could be. SQLite-backed, so it works on the Workers Free plan.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "TrialCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrialCounter"]
